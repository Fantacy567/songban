<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>松伴 · 团队同频 · 演示</title>
<style>
:root{
  --ink:#17243b;--muted:#66758a;--blue:#335fea;--line:#e3e8f0;--paper:#f4f6fa;
  --warm:#fef5e6;--green:#13856a;--red:#b4453a;
  font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);
}
*{box-sizing:border-box}
body{margin:0;font-size:14px;line-height:1.65}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px 14px}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.ghost{background:transparent}
button:disabled{cursor:not-allowed;opacity:.5}
input,textarea,select{display:block;width:100%;background:#fff;border:1px solid #ced6e3;border-radius:8px;padding:10px 12px;color:var(--ink)}
textarea{resize:vertical}
label{display:block;margin:12px 0 5px;font-weight:600;font-size:13px}
h1{font-size:26px;letter-spacing:-.6px;line-height:1.3;margin:0 0 6px}
h2{font-size:18px;line-height:1.4;margin:0 0 8px}
h3{font-size:15px;margin:0 0 7px}
p{margin:0 0 10px}
small,.muted{color:var(--muted);font-size:12px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--blue);font-weight:700}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.sidebar{background:#16243b;color:#d1d9e7;padding:26px 16px 84px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{font-size:24px;font-weight:750;color:#fff;letter-spacing:1px}
.brand span{display:block;font-size:11px;letter-spacing:1.6px;font-weight:400;color:#94a7c4;margin-top:3px}
.nav{display:grid;gap:5px;margin-top:30px}
.nav button{border:0;background:transparent;color:#becbdf;text-align:left;padding:10px 12px;border-radius:9px}
.nav button.on{background:#314468;color:#fff}
.locked{display:grid;gap:2px;border-top:1px solid #35425a;margin-top:22px;padding-top:16px}
.locked .t{font-size:11px;letter-spacing:1.4px;color:#5d6f8c;margin-bottom:6px}
.locked button{background:transparent;border:0;text-align:left;color:#788aa5;font-size:12px;padding:5px 12px}
.sidebar footer{margin-top:auto;padding-top:18px;font-size:12px;color:#94a7c4}
.sidebar footer .who{color:#fff;font-weight:600}

main{padding:26px 34px 90px;max-width:1080px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}
.chip{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted)}
.chip.blue{border-color:#c9d6fd;background:#eef3ff;color:var(--blue)}
.chip.green{border-color:#bfe0d6;background:#e9f6f1;color:var(--green)}
.chip.warm{border-color:#f0dcb4;background:var(--warm);color:#8a5f18}
.chip.red{border-color:#e6c7c2;background:#fdf0ee;color:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.card.flat{border-radius:12px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.divider{height:1px;background:var(--line);margin:16px 0}
.next-action{border-left:4px solid var(--blue);background:#fff;border-radius:12px;padding:16px 18px;margin-bottom:14px;display:flex;gap:22px;align-items:center;justify-content:space-between}
.avatar{width:34px;height:34px;border-radius:50%;background:#e8eefc;color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.who-line{display:flex;gap:10px;align-items:center}
.task{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;margin-bottom:10px}
.task .h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.task .k{font-size:11px;letter-spacing:1.4px;color:var(--muted);font-weight:700}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:10px 0;color:#33415a}
.quote.a{border-color:#335fea}
.quote.b{border-color:#c08a2e}
.warn{background:var(--warm);border:1px solid #f0dcb4;border-radius:11px;padding:13px 15px}
.note{background:#f8fafd;border:1px dashed #cfd8e6;border-radius:11px;padding:12px 14px;color:var(--muted);font-size:12.5px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:#f5f7fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;color:#2b3a52}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid #eef1f6;vertical-align:top}
.hidden{display:none !important}
/* 新出现的内容用高亮提示，不改透明度——避免任何环境下内容不可见 */
.fade{animation:flash .6s ease}
@keyframes flash{0%{background:#eef3ff;border-color:#c9d6fd}100%{background:#fff}}

/* 演示条 */
.demo-bar{position:fixed;left:0;right:0;bottom:0;background:#0f1a2c;color:#dfe6f2;padding:12px 20px;display:flex;gap:16px;align-items:center;z-index:40}
.demo-bar .step{font-size:12px;letter-spacing:1.6px;color:#7f93b3}
.demo-bar .label{font-size:14px;font-weight:600}
.demo-bar button{background:#22304a;border:1px solid #354766;color:#dfe6f2;padding:7px 12px;border-radius:8px;font-size:13px}
.demo-bar button:hover{background:#2c3d5c}
.dots{display:flex;gap:5px}
.dots i{width:22px;height:3px;border-radius:2px;background:#2c3d5c}
.dots i.on{background:#5b86ff}
.badge-demo{position:fixed;top:14px;right:18px;z-index:40;background:#fff3d6;border:1px solid #e8d29a;color:#7a5a12;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:relative;height:auto}
  .nav{grid-template-columns:repeat(2,1fr);display:grid}
  main{padding:20px 16px 110px}
  .grid2,.grid3{grid-template-columns:1fr}
  .next-action{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<div class="badge-demo">演示数据 · 不连接后端</div>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">松伴<span>个人智能体 / 团队空间 / 共同方向</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="locked">
      <div class="t">锁定 · 本轮聚焦核心协作</div>
      <button disabled>找比赛与组队大厅</button>
      <button disabled>灵感与素材库</button>
      <button disabled>赛后复盘与培训</button>
      <button disabled>主办方办赛</button>
    </div>
    <footer>
      <div>只共享当前项目获准内容</div>
      <div style="margin-top:8px"><span class="who">林知远</span> · 队长</div>
    </footer>
  </aside>
  <main id="main"></main>
</div>

<div class="demo-bar">
  <span class="step" id="stepNo">演示模式</span>
  <span class="label" id="stepLabel">点「开始演示」，全流程自动走一遍</span>
  <span class="spacer"></span>
  <span class="dots" id="dots"></span>
  <button id="btnPrev">上一步</button>
  <button id="btnPlay" class="primary" style="background:#335fea;border-color:#335fea">开始演示</button>
</div>

<script src="pitch-demo.js" defer></script>
</body>
</html>
