<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>松伴</title>
  <style>
    :root { --ink:#1c1c1c; --line:#c8c8c8; --paper:#f3f3f3; --card:#fff; --green:#1f8a4c; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 "PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--paper); }
    header { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; padding:14px 18px 0; }
    header h1 { font-size:16px; margin:0; font-weight:650; }
    header p { margin:4px 0 0; color:#666; font-size:13px; }
    .switch { display:flex; gap:8px; align-items:flex-end; }
    .switch label { margin:0; }
    .switch select { width:auto; min-width:160px; }
    nav { display:flex; flex-wrap:wrap; gap:6px; padding:12px 18px; position:sticky; top:0; background:var(--paper); z-index:2; }
    nav button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 10px; font:inherit; cursor:pointer; }
    nav button.on { background:#111; color:#fff; border-color:#111; }
    main { padding:0 18px 40px; }
    .work { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:14px; align-items:start; }
    h2 { font-size:20px; margin:0 0 8px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:0 0 12px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    label { display:block; font-size:13px; font-weight:650; margin:8px 0 4px; }
    input, textarea, select { width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; background:#fff; }
    textarea { min-height:72px; resize:vertical; }
    .btn { border:1px solid #111; background:#111; color:#fff; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; }
    .btn.ghost { background:#fff; color:#111; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .muted { color:#666; font-size:13px; }
    .kicker { font-size:12px; letter-spacing:.04em; color:#666; }
    .hero-name { font-size:40px; line-height:1.15; margin:8px 0; font-weight:700; }
    .count { font-size:48px; font-variant-numeric:tabular-nums; letter-spacing:.02em; margin:0; }
    .split { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .person { border:1px dashed var(--line); border-radius:8px; padding:10px; margin-top:8px; }
    .bar { height:8px; background:#e6e6e6; border-radius:99px; overflow:hidden; margin-top:6px; }
    .bar span { display:block; height:100%; background:#111; }
    .avatar { width:36px; height:36px; border-radius:50%; border:1px solid #111; display:grid; place-items:center; font-size:13px; background:#fff; flex:none; }
    .who { display:flex; gap:8px; align-items:center; margin:8px 0; }
    .tag { display:inline-block; border:1px solid var(--line); border-radius:99px; padding:0 8px; font-size:12px; margin-right:4px; }
    .tag.must { border-color:#111; }
    .tree { margin:0; padding-left:18px; }
    .shelf { display:flex; gap:8px; flex-wrap:wrap; }
    .shelf .item { border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:180px; background:#fafafa; }
    .top3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .bubble { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:0 0 8px; background:#fff; font-size:13px; }
    .bubble.me { background:#f7f7f7; }
    .chat { border:1px solid var(--line); border-radius:10px; background:#fff; padding:12px; position:sticky; top:64px; }
    .chat h3 { margin:0 0 4px; font-size:14px; }
    .composer { display:flex; gap:6px; margin-top:8px; }
    .composer input { flex:1; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { border-bottom:1px solid var(--line); text-align:left; padding:8px 4px; vertical-align:top; }
    .pay { min-height:280px; display:grid; place-items:center; text-align:center; }
    .tick { width:96px; height:96px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-size:52px; margin:0 auto 12px; }
    .stages { display:flex; gap:0; list-style:none; padding:0; margin:18px 0; }
    .stages li { flex:1; text-align:center; font-size:13px; padding-top:10px; border-top:3px solid #ddd; }
    .stages li.now { border-top-color:var(--green); font-weight:700; }
    .code { font-size:32px; letter-spacing:.12em; margin:8px 0; font-weight:700; }
    .error { background:#fff4f4; border:1px solid #e3b4b4; border-radius:8px; padding:8px 10px; }
    .ok, .hint { background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
    .hint { border-color:#111; }
    pre { white-space:pre-wrap; font:13px/1.45 ui-monospace,monospace; margin:0; }
    .check { font-weight:500; }
    footer { padding:0 18px 24px; }
    @media (max-width:860px) {
      header, .switch { flex-direction:column; align-items:stretch; }
      .work, .split, .top3 { grid-template-columns:1fr; }
      .hero-name, .count { font-size:32px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>松伴</h1>
      <p id="who">还没进入</p>
    </div>
    <div id="switch"></div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
  <footer><p class="muted">本机代替短信、飞书、GitHub 和付费模型。旧工作台在 <a href="/classic">/classic</a>。</p></footer>
  <script src="/static/studio.js?v=20261027-2" defer></script>
</body>
</html>
