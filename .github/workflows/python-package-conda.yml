name: Python tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Codex CLI for local plugin registration tests
        run: npm install -g @openai/codex@0.165.0-alpha.1.2
      - name: Run tests without paid model calls
        env:
          SONGBAN_CORE_ONLY: '0'
          SONGBAN_ENFORCE_JOURNEY: '0' # Legacy compatibility tests; strict journey tests enable it explicitly.
        run: python -m unittest discover -s tests -q
