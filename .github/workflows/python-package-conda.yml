name: Python tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Install Codex CLI for local plugin registration tests
        run: npm install -g @openai/codex@0.145.0
      - name: Run tests without paid model calls
        env:
          SONGBAN_CORE_ONLY: '0'
        run: python -m unittest discover -s tests -q
